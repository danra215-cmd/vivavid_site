<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects – Vivavid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#151719; --muted:rgba(21,23,25,.59); --line:#e0e0e2; --accent:#2d5fe3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); line-height:1.6; }
  .wrap { max-width:880px; margin:0 auto; padding:0 20px; }
  header { padding:28px 0; border-bottom:1px solid var(--line); }
  header a { color:var(--accent); text-decoration:none; }
  h1 { font-size:2rem; margin:40px 0 8px; }
  p { color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:24px; }
  .card { display:block; border:1px solid var(--line); border-radius:8px; padding:20px; color:var(--ink); text-decoration:none; }
  .card:hover { border-color:var(--accent); }
  .card h2 { margin:0 0 4px; font-size:1.15rem; }
  .card span { color:var(--muted); font-size:.95rem; }
  .soon { opacity:.5; pointer-events:none; }
</style>
</head>
<body>
<header><div class="wrap"><a href="../">← Vivavid</a></div></header>
<main class="wrap">
  <h1>Välj ämne</h1>
  <div class="grid">
    <a class="card" href="matte/"><h2>Matte</h2><span>Övningsuppgifter i matematik</span></a>
    <a class="card" href="web_demo/"><h2>Web demo</h2><span>Test av JavaScript och grafik</span></a>
  </div>
</main>
</body>
</html>
